services:
  - type: web
    name: afterglow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TMDB_API_KEY
        sync: false
